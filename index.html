<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horaires de prière — Guyancourt</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18324b;
        background: #f4f7fa;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 0;
      }

      main {
        width: min(100% - 2rem, 32rem);
        margin: 0 auto;
        padding: 2rem 0;
      }

      header { margin-bottom: 1.5rem; }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.6rem, 8vw, 2.25rem);
        line-height: 1.1;
      }

      #date { margin: 0; color: #52687b; }

      .prayer-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
        margin: 0;
      }

      .prayer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 1rem;
        border: 1px solid #dce5ec;
        border-radius: 0.75rem;
        background: #fff;
        box-shadow: 0 0.25rem 1rem rgb(24 50 75 / 6%);
      }

      dt { font-weight: 600; }
      dd { margin: 0; font-variant-numeric: tabular-nums; font-size: 1.25rem; }

      @media (min-width: 30rem) {
        .prayer-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .prayer { display: block; }
        dd { margin-top: 0.35rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Horaires de prière</h1>
        <p id="date" aria-live="polite"></p>
      </header>
      <dl class="prayer-list" aria-label="Horaires du jour">
        <div class="prayer"><dt>Fajr</dt><dd id="fajr">--:--</dd></div>
        <div class="prayer"><dt>Chorouq</dt><dd id="sunrise">--:--</dd></div>
        <div class="prayer"><dt>Dhouhr</dt><dd id="dhuhr">--:--</dd></div>
        <div class="prayer"><dt>Asr</dt><dd id="asr">--:--</dd></div>
        <div class="prayer"><dt>Maghreb</dt><dd id="maghrib">--:--</dd></div>
        <div class="prayer"><dt>Isha</dt><dd id="isha">--:--</dd></div>
      </dl>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
